name: Server CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/**'

jobs:
  canonical-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: palsafar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/palsafar_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/palsafar_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/palsafar_test
      JWT_SECRET: ci-test-jwt-secret-min-32-chars-long
      NODE_ENV: test
      SYNC_CANONICAL_CREDENTIALS: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Canonical unit tests
        run: npx vitest run --config vitest.unit.config.js src/__tests__/canonical.test.ts src/__tests__/places-public-visibility.test.ts src/__tests__/geohash-duplicate-scan.test.ts src/__tests__/boundary-dataset.test.ts src/__tests__/place-images.sync.test.ts

      - name: Build
        run: npm run build
        env:
          CLIENT_URL: http://localhost:3000

      - name: Performance benchmarks (non-blocking)
        run: npx ts-node scripts/benchmarks/canonical-bench.ts
        continue-on-error: true
