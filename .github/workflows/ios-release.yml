name: iOS Release

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual App Store upload'

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Archive & Upload to App Store Connect
    runs-on: macos-26

    env:
      WORKSPACE: ios/PalSafar.xcworkspace
      SCHEME: PalSafar
      CONFIGURATION: Release
      ARCHIVE_PATH: build/PalSafar.xcarchive
      EXPORT_PATH: build/export
      EXPORT_OPTIONS: ios/ExportOptions.plist
      DEVELOPMENT_TEAM: G2MLFC7B5R
      KEYCHAIN_NAME: palsafar-ci.keychain
      KEYCHAIN_PASSWORD: ci-keychain-palsafar
      CERTIFICATE_PATH: /tmp/build_certificate.p12
      PP_PATH: /tmp/build_pp.mobileprovision
      GOOGLE_PLIST_PATH: ios/PalSafar/GoogleService-Info.plist
      API_KEY_PATH: /tmp/AuthKey_ci.p8

    steps:

      # ── Diagnostics ────────────────────────────────────────────────────────
      - name: Environment diagnostics
        run: |
          echo "=== Node ==="
          node --version  || echo "node not yet available"
          echo "=== npm ==="
          npm --version   || echo "npm not yet available"
          echo "=== Ruby ==="
          ruby --version
          echo "=== Bundler ==="
          bundle --version || echo "bundler not yet available"
          echo "=== CocoaPods (pre-install) ==="
          pod --version   || echo "pod not yet available"
          echo "=== Xcode ==="
          xcodebuild -version
          echo "=== Xcode path ==="
          xcode-select --print-path
          echo "=== Available SDKs ==="
          xcodebuild -showsdks

      # ── Hard Xcode 26 / iOS 26 SDK validation ──────────────────────────────
      - name: Validate Xcode 26 and iOS 26 SDK
        run: |
          XCODE_VERSION=$(xcodebuild -version | head -1 | awk '{print $2}')
          XCODE_MAJOR=$(echo "$XCODE_VERSION" | cut -d. -f1)
          echo "Detected Xcode version: $XCODE_VERSION (major: $XCODE_MAJOR)"

          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "ERROR: Xcode $XCODE_VERSION is too old."
            echo "App Store Connect requires Xcode 26 or later as of April 28, 2026."
            exit 1
          fi
          echo "Xcode major version check: PASSED (>= 26)"

          if ! xcodebuild -showsdks 2>/dev/null | grep -q 'iphoneos26'; then
            echo "ERROR: iOS 26 SDK not found in available SDKs."
            echo "Available SDKs:"
            xcodebuild -showsdks
            exit 1
          fi
          echo "iOS 26 SDK check: PASSED"

      # ── Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── GoogleService-Info.plist ───────────────────────────────────────────
      # Required for Firebase init. Gitignored — must be provided as a secret.
      - name: Decode GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "ERROR: Missing required GitHub secret: GOOGLE_SERVICE_INFO_PLIST_BASE64"
            echo "Add this secret in Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > "$GOOGLE_PLIST_PATH"
          echo "GoogleService-Info.plist decoded (contents not logged)"

      # ── Node ───────────────────────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      # ── Ruby / CocoaPods ───────────────────────────────────────────────────
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Ruby gems (CocoaPods)
        run: bundle install

      - name: Report CocoaPods version
        run: bundle exec pod --version

      - name: Install CocoaPods dependencies
        run: bundle exec pod install --project-directory=ios

      - name: Verify xcworkspace was generated
        run: |
          if [ ! -d "ios/PalSafar.xcworkspace" ]; then
            echo "ERROR: ios/PalSafar.xcworkspace was not generated by pod install"
            exit 1
          fi
          echo "ios/PalSafar.xcworkspace: OK"

      # ── Keychain ───────────────────────────────────────────────────────────
      - name: Create temporary keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | tr -d '"')

      # ── Distribution Certificate ───────────────────────────────────────────
      - name: Install distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_NAME" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_NAME"
          echo "Distribution certificate installed (contents not logged)"

      # ── Provisioning Profile ───────────────────────────────────────────────
      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          PP_UUID=$(security cms -D -i "$PP_PATH" 2>/dev/null | plutil -extract UUID raw -)
          echo "Provisioning profile UUID: $PP_UUID"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID".mobileprovision
          echo "Provisioning profile installed"

      # ── Archive ────────────────────────────────────────────────────────────
      - name: Archive (xcodebuild)
        env:
          NSUnbufferedIO: YES
        run: |
          set +e
          set -o pipefail
          mkdir -p build
          LOG_PATH="build/xcodebuild-archive.log"
          echo "Starting xcodebuild archive; full log: $LOG_PATH"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" 2>&1 | tee "$LOG_PATH"
          xcodebuild_status=${PIPESTATUS[0]}
          set +o pipefail
          echo ""
          echo "=== xcodebuild archive exit code: $xcodebuild_status ==="
          echo "=== Diagnostic lines (errors / code sign / phases) ==="
          grep -E -i -n \
            -e 'error:' \
            -e 'fatal error:' \
            -e 'codesign' \
            -e 'phasescriptexecution' \
            -e 'swiftcompile' \
            -e 'compilec' \
            -e '(^|[^[:alpha:]])ld([[:space:]]|/|\.)' \
            -e 'provisioning' \
            -e 'signing' \
            -e 'no profiles' \
            -e 'failed' \
            "$LOG_PATH" || echo "(no matching diagnostic lines found)"
          echo ""
          echo "=== Last 100 lines of $LOG_PATH ==="
          tail -n 100 "$LOG_PATH"
          echo ""
          echo "=== ARCHIVE_EXIT=$xcodebuild_status ==="
          exit "$xcodebuild_status"

      # ── Export IPA ─────────────────────────────────────────────────────────
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

      # ── Verify archive and IPA ─────────────────────────────────────────────
      - name: Verify archive and IPA
        run: |
          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "ERROR: Archive not found at $ARCHIVE_PATH"
            ls -la build/ || true
            exit 1
          fi
          echo "Archive: $ARCHIVE_PATH — OK"

          IPA_FILE=$(find "$EXPORT_PATH" -name "*.ipa" | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: No .ipa found in $EXPORT_PATH"
            ls -la "$EXPORT_PATH" || true
            exit 1
          fi

          IPA_SIZE=$(du -sh "$IPA_FILE" | cut -f1)
          IPA_BASENAME=$(basename "$IPA_FILE")
          echo "IPA: $IPA_BASENAME ($IPA_SIZE)"
          echo "IPA_PATH=$IPA_FILE" >> "$GITHUB_ENV"

      # ── App Store Connect Upload ───────────────────────────────────────────
      # APPSTORE_API_KEY secret is Base64-encoded .p8 content.
      # Decode it, register the raw PEM as a masked value, then expose via
      # GITHUB_ENV so the action can consume it without it appearing in logs.
      # ::add-mask:: instructs GitHub to redact this value from all log output.
      - name: Prepare App Store Connect API key
        env:
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: |
          printf '%s' "$APPSTORE_API_KEY" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          RAW_KEY=$(cat "$API_KEY_PATH")
          echo "::add-mask::$RAW_KEY"
          echo "APPSTORE_API_PRIVATE_KEY<<EOFPEM" >> "$GITHUB_ENV"
          echo "$RAW_KEY"                          >> "$GITHUB_ENV"
          echo "EOFPEM"                            >> "$GITHUB_ENV"
          echo "API key decoded and masked (contents not logged)"

      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.IPA_PATH }}
          app-type: ios
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ env.APPSTORE_API_PRIVATE_KEY }}

      # ── Cleanup ────────────────────────────────────────────────────────────
      - name: Cleanup secrets and keychains
        if: always()
        run: |
          rm -f "$CERTIFICATE_PATH"
          rm -f "$PP_PATH"
          rm -f "$API_KEY_PATH"
          rm -f "$GOOGLE_PLIST_PATH"
          security delete-keychain "$KEYCHAIN_NAME" || true
          echo "Cleanup complete"