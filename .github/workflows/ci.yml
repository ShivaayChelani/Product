name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Server dependencies
        run: cd server && npm ci 2>&1

      - name: Generate Prisma client
        run: cd server && npx --yes prisma generate 2>&1

      - name: Server lint
        run: cd server && npm run lint 2>&1

      - name: Server typecheck
        run: cd server && npx --yes tsc --noEmit -p tsconfig.json 2>&1

      - name: Server build
        run: cd server && npm run build 2>&1
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/ci_build
          DIRECT_URL: postgresql://postgres:password@localhost:5432/ci_build
          JWT_SECRET: ci-build-jwt-secret-minimum-32-characters
          CLIENT_URL: http://localhost:3000

      - name: Validate production env profile
        run: cd server && npm run validate:env 2>&1
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:password@localhost:5432/ci_build
          DIRECT_URL: postgresql://postgres:password@localhost:5432/ci_build
          JWT_SECRET: ci-build-jwt-secret-minimum-32-characters-minimum
          CLIENT_URL: https://admin.palsafar.com
          SMTP_HOST: smtp-relay.brevo.com
          SMTP_USER: ci@example.com
          SMTP_PASS: ci-smtp-pass
          SMTP_FROM_EMAIL: ci@example.com
          SENTRY_DSN: https://ci-dummy@sentry.example.com/1
          CLOUDINARY_CLOUD_NAME: ci-dummy
          CLOUDINARY_API_KEY: 000000000000000
          CLOUDINARY_API_SECRET: ci-dummy-secret
          SYNC_CANONICAL_CREDENTIALS: "false"
          PRUNE_EXTRA_USERS: "false"

      - name: Client dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund 2>&1

      - name: Client typecheck
        run: npx --yes tsc --noEmit 2>&1

      - name: Admin dependencies
        run: cd admin && npm install --no-audit --no-fund 2>&1

      - name: Admin lint
        run: cd admin && npm run lint 2>&1

      - name: Admin build
        run: cd admin && npm run build 2>&1

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: cd server && npm ci 2>&1

      - name: Generate Prisma client
        run: cd server && npx --yes prisma generate 2>&1

      - name: Install PostGIS and pg_trgm extensions
        run: cd server && PGPASSWORD=password psql -h localhost -U postgres -d test_db -c "CREATE EXTENSION IF NOT EXISTS postgis;" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" 2>&1

      - name: Push schema to test DB
        run: cd server && npx --yes prisma db push 2>&1
        env:
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db
          DIRECT_URL: postgresql://postgres:password@localhost:5432/test_db

      - name: Run unit tests
        run: cd server && npm run test:unit 2>&1
        env:
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db
          DIRECT_URL: postgresql://postgres:password@localhost:5432/test_db
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars

      - name: Run integration tests
        run: cd server && npm run test:integration 2>&1
        env:
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db
          DIRECT_URL: postgresql://postgres:password@localhost:5432/test_db
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars

      - name: Run e2e tests
        run: cd server && npm run test:e2e 2>&1
        env:
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db
          DIRECT_URL: postgresql://postgres:password@localhost:5432/test_db
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
